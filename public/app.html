<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CareQueue Clinic</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="h-full">
  <div id="shell" class="min-h-full">
    <!-- Mobile overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 z-30 hidden bg-slate-900/40 lg:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-slate-200 bg-white transition-transform duration-200 lg:translate-x-0">
      <div class="flex h-16 items-center gap-3 border-b border-slate-100 px-5">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-brand-600 text-white">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.2-9.4C1.6 8.3 3.7 5 7 5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.3 0 5.4 3.3 4.2 6.6C19.5 16.4 12 21 12 21Z"/><path d="M7.5 12h2.5l1.2-2.5 1.8 5 1.3-2.5h2.2"/></svg>
        </span>
        <div class="leading-tight">
          <p class="text-sm font-bold tracking-tight text-slate-900">CareQueue Clinic</p>
          <p id="role-label" class="text-xs text-slate-500"></p>
        </div>
      </div>
      <nav id="nav" class="flex-1 space-y-6 overflow-y-auto px-3 py-5" aria-label="Main navigation"></nav>
      <div id="user-card" class="border-t border-slate-100 p-3"></div>
    </aside>

    <!-- Main column -->
    <div class="lg:pl-64">
      <header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-slate-200 bg-white/90 px-4 backdrop-blur sm:px-6">
        <button id="menu-btn" class="btn-icon lg:hidden" aria-label="Open menu">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="min-w-0 flex-1">
          <h1 id="page-title" class="truncate text-lg font-semibold tracking-tight text-slate-900"></h1>
        </div>
        <div id="topbar-right" class="flex items-center gap-2"></div>
      </header>
      <main id="view" class="mx-auto max-w-7xl px-4 py-6 outline-none sm:px-6 lg:px-8" tabindex="-1"></main>
    </div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
